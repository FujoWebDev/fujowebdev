heading: Shipped issue 1 digital preview
body: >-
  <p>After a lot of work, our backers finally get to hold the zine in their
  hands! The zip folder is *heavy*, but chock-full of goods: printable
  zines come foldable like a real zine booklet, or as half/full-page PDFs
  that look as great on screens as they do on paper. Not to mention, everything
  is available in both A4 and Letter, to be enjoyed all over the
  world!</p>
tag: v1.0-issue-1
callToAction:
  title: Where do I find these?
  text: >-
    Look for the folder in your backer rewards, or for the delivery email if you
    bought it at a con. Not there? Write us at <a
    href="mailto:contacts@fujocoded.com">contacts@fujocoded.com</a> or DM us on
    Kickstarter! Want to know when it's publicly on sale? TODO: signup for our waiting list!
