heading: Digital rewards
body: >-
  <p>Now shipping: our exclusive digital pack! Featuring: wallpapers of our characters
  in every size we could think of, a printable HTML paper doll, a pile
  of Boba-tan emoji, website goodies (like a corner buddy you can
  drop into your own site), behind-the-scenes pitch decks, character notes, and
  yes!—a nostalgic, git-alicious 88×31 badge.</p>
callToAction:
  title: Where do I find these?
  text: >-
    Alongside your exclusive badge in your backer rewards, or by [backing FujoCoded
    on Patreon](https://www.patreon.com/fujocoded) for some behind-the-scenes
    content. Not there? Write us at <a
    href="mailto:contacts@fujocoded.com">contacts@fujocoded.com</a> or DM us on
    Kickstarter!
